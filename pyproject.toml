[build-system]
requires = ["setuptools>=61.0.0", "wheel", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "chord_util"
authors = [
  {name = "The CHORD Collaboration"}
]
description = "Utilities for CHORD"
requires-python = ">=3.10"
dynamic = ["readme", "version"]
license = {file = "LICENSE"}
dependencies = [
    "caput @ git+https://github.com/radiocosmology/caput.git",
    "h5py",
    "numpy >= 1.24",
]

[tool.ruff]
lint.select = ["E", "F", "UP", "NPY", "BLE", "C4", "RET"]
lint.ignore = []
target-version = "py310"

[tool.setuptools]
packages = ["chord_util"]

[tool.setuptools.dynamic]
readme = {file = ["README.md"], content-type = "text/markdown"}

[tool.setuptools_scm]
fallback_version = "0.1.0"
